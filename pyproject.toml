[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurface"
version = "0.0.1"
description = "Arbitrage-free implied volatility surface construction for crypto options"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gavinwunz" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.90",
    "py_vollib>=1.0.1",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["volsurface*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
