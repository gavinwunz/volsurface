[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volfoundry"
version = "0.1.0"
description = "Volatility surface construction, calibration, arbitrage diagnostics, and options pricing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gavinwunz" }]
maintainers = [{ name = "Gavinwunz" }]
keywords = [
    "quantitative-finance",
    "options-pricing",
    "implied-volatility",
    "volatility-surface",
    "volatility-smile",
    "svi",
    "ssvi",
    "derivatives",
    "deribit",
    "crypto-options",
    "black-76",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/gavinwunz/volsurface"
Documentation = "https://github.com/gavinwunz/volsurface"
Repository = "https://github.com/gavinwunz/volsurface"
Issues = "https://github.com/gavinwunz/volsurface/issues"
Changelog = "https://github.com/gavinwunz/volsurface/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.90",
    "py_vollib>=1.0.1",
    "ruff>=0.5",
]
docs = [
    "matplotlib>=3.8",
]
benchmark = [
    "QuantLib-Python>=1.35",
    "py_vollib>=1.0.1",
]

[project.scripts]
volfoundry = "volfoundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volfoundry = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: Fast deterministic unit tests (default CI suite)",
    "integration: Tests that combine multiple modules",
    "property: Hypothesis property-based tests for mathematical invariants",
    "regression: Golden-fixture tests with expected outputs and tolerances",
    "live: Tests requiring live Deribit network access — excluded from default suite",
    "slow: Tests that take significantly longer than the typical unit",
    "benchmark: Performance benchmarks — may require optional dependencies",
]

[tool.coverage.run]
source = ["src/volfoundry"]
omit = ["src/volfoundry/cli/*", "src/volfoundry/surface/plotting.py"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
]

[tool.coverage.paths]
source = ["src"]