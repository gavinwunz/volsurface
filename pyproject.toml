[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volfoundry"
version = "0.1.0"
description = "Volatility surface construction, calibration, arbitrage diagnostics, and options pricing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gavinwunz" }]
maintainers = [{ name = "Gavinwunz" }]
keywords = [
    "quantitative-finance",
    "options-pricing",
    "implied-volatility",
    "volatility-surface",
    "volatility-smile",
    "svi",
    "ssvi",
    "derivatives",
    "deribit",
    "crypto-options",
    "black-76",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/gavinwunz/volsurface"
Documentation = "https://github.com/gavinwunz/volsurface"
Repository = "https://github.com/gavinwunz/volsurface"
Issues = "https://github.com/gavinwunz/volsurface/issues"
Changelog = "https://github.com/gavinwunz/volsurface/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.90",
    "py_vollib>=1.0.1",
    "ruff>=0.5",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "check-manifest>=0.50",
]
docs = [
    "matplotlib>=3.8",
]
benchmark = [
    "QuantLib-Python>=1.35",
    "py_vollib>=1.0.1",
]

[project.scripts]
volfoundry = "volfoundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volfoundry = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: Fast deterministic unit tests (default CI suite)",
    "integration: Tests that combine multiple modules",
    "property: Hypothesis property-based tests for mathematical invariants",
    "regression: Golden-fixture tests with expected outputs and tolerances",
    "live: Tests requiring live Deribit network access — excluded from default suite",
    "slow: Tests that take significantly longer than the typical unit",
    "benchmark: Performance benchmarks — may require optional dependencies",
]

[tool.coverage.run]
source = ["src/volfoundry"]
omit = ["src/volfoundry/cli/*", "src/volfoundry/surface/plotting.py"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
]

[tool.coverage.paths]
source = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    # Pyflakes: basic errors
    "F",
    # Pycodestyle: style (E, W)
    "E", "W",
    # isort: import ordering
    "I",
    # pyupgrade: modern Python syntax
    "UP",
    # flake8-bugbear: common bugs
    "B",
    # flake8-comprehensions: better comprehensions
    "C4",
    # flake8-simplify: simpler code
    "SIM",
    # Ruff-specific rules
    "RUF",
    # flake8-blind-except
    "BLE",
]
ignore = [
    # Allow lambda assignments (convenient for math code)
    "E731",
]
# Fix violations in these files/dirs automatically
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["volfoundry"]

[tool.ruff.lint.per-file-ignores]
# Tests: blind exceptions, special/math chars, debug code patterns (all intentional)
"tests/**/*.py" = [
    "BLE001", "SIM105", "B007", "E402",
    "RUF001", "RUF002", "RUF003", "RUF043",
]
# Source files with intentional math-notation chars (Greek, en-dash, ×)
"src/volfoundry/tolerances.py" = ["RUF001", "RUF002"]
"src/volfoundry/arbitrage/checks.py" = ["RUF002", "RUF001", "E501"]
"src/volfoundry/arbitrage/plotting.py" = ["RUF001", "RUF002", "E501"]
"src/volfoundry/surface/plotting.py" = ["RUF001", "RUF002", "E501"]
"src/volfoundry/surface/reporting.py" = ["RUF001", "E501"]
"src/volfoundry/surface/ssvi.py" = ["RUF001", "RUF002"]
"src/volfoundry/surface/calibration.py" = ["RUF002"]
# Source files with legitimate blind-except patterns (calibration loop, metadata parsing)
"src/volfoundry/data/persistence.py" = ["BLE001"]
"src/volfoundry/surface/builder.py" = ["BLE001", "E501"]
"src/volfoundry/data/filters.py" = ["E501"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"